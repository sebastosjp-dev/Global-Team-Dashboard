<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body style="width:1400px"><div id="tab-metrics-grid"></div><pre id="err"></pre>
<script type="module">
window.onerror=(m,s,l)=>{document.getElementById('err').textContent+=m+' '+l+'\n'};
import { renderTabMetrics } from './views.js';
const country = new URLSearchParams(location.search).get('c');
const buf = await (await fetch('_live_test.xlsx')).arrayBuffer();
const wb = XLSX.read(new Uint8Array(buf), {type:'array'}); const wd={};
wb.SheetNames.forEach(s=>wd[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:'',cellDates:true}));
window.workbookData = wd;
try { renderTabMetrics(wd['ORDER SHEET'], 'ORDER SHEET', country, wd, ''); } catch(e){ document.getElementById('err').textContent+=e.stack; }
</script></body></html>
